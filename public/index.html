<!doctype html>
<html lang="en" data-register="browse">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <title>RecallLab — a spatial recall reader for COMP3421</title>
    <meta
      name="description"
      content="RecallLab is a spatial recall reader for hierarchical course material: browse a tree of folders and cards, then drop into Focus Mode and recall one card at a time."
    />
    <meta name="color-scheme" content="light dark" />

    <!--
      The four self-hosted latin-subset faces (contracts §7). `crossorigin` is
      required: font requests are made in CORS-anonymous mode, so a preload
      without it would be fetched twice.
    -->
    <link
      rel="preload"
      as="font"
      type="font/woff2"
      crossorigin
      href="/fonts/geist-latin-400.woff2"
    />
    <link
      rel="preload"
      as="font"
      type="font/woff2"
      crossorigin
      href="/fonts/geist-latin-500.woff2"
    />
    <link
      rel="preload"
      as="font"
      type="font/woff2"
      crossorigin
      href="/fonts/geist-latin-600.woff2"
    />
    <link
      rel="preload"
      as="font"
      type="font/woff2"
      crossorigin
      href="/fonts/geist-mono-latin-400.woff2"
    />

    <!--
      Stylesheets, in cascade order (contracts §5, §6):
      tokens → base → layout → stage → edit.
      `stage.css` and `edit.css` consume the tokens; they never redefine them.
    -->
    <link rel="stylesheet" href="/styles/tokens.css" />
    <link rel="stylesheet" href="/styles/base.css" />
    <link rel="stylesheet" href="/styles/layout.css" />
    <link rel="stylesheet" href="/styles/stage.css" />
    <link rel="stylesheet" href="/styles/edit.css" />
  </head>

  <body>
    <!--
      The shell (contracts §5). The registry is exact: other owners mount into
      these ids and must not restructure the page.
    -->
    <div id="app">
      <aside id="spine" aria-label="Outline">
        <div id="spine-tree"></div>
      </aside>

      <main id="main">
        <header id="toolbar">
          <nav id="breadcrumb" aria-label="Breadcrumb"></nav>
          <div id="toolbar-actions">
            <!--
              The Edit toggle, the Focus-mode entry and the create control
              (#action-create) are rendered here by `js/main.js`.
            -->
          </div>
        </header>

        <div id="content">
          <ul id="grid" class="grid"></ul>
          <div id="stage-root"></div>
        </div>
      </main>
    </div>

    <!--
      The polite live region for stage announcements (contracts §9). It is
      visually hidden but not `display:none`, so assistive technology still
      observes it.
    -->
    <div
      id="stage-live"
      role="status"
      aria-live="polite"
      aria-atomic="true"
      style="
        position: absolute;
        width: 1px;
        height: 1px;
        margin: -1px;
        padding: 0;
        overflow: hidden;
        clip-path: inset(50%);
        white-space: nowrap;
        border: 0;
      "
    ></div>

    <script type="module" src="/js/main.js"></script>
  </body>
</html>
